<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34342a"/>
      <stop offset="1" stop-color="#16160e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7cc79" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c7cc79" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3d0c0"/>
      <stop offset="1" stop-color="#e3e892"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="8" y="8" width="240" height="240" rx="58"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="#5a5a4a" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <!-- grid -->
    <g stroke="#e5e3d6" stroke-opacity="0.07" stroke-width="2">
      <line x1="8" y1="88" x2="248" y2="88"/>
      <line x1="8" y1="138" x2="248" y2="138"/>
      <line x1="8" y1="188" x2="248" y2="188"/>
    </g>

    <!-- candles -->
    <g stroke-linecap="round">
      <line x1="62" y1="150" x2="62" y2="206" stroke="#ff8a80" stroke-width="4"/>
      <rect x="51" y="162" width="22" height="32" rx="5" fill="#ff8a80"/>
      <line x1="104" y1="128" x2="104" y2="196" stroke="#7fd38a" stroke-width="4"/>
      <rect x="93" y="142" width="22" height="40" rx="5" fill="#7fd38a"/>
      <line x1="146" y1="110" x2="146" y2="176" stroke="#7fd38a" stroke-width="4"/>
      <rect x="135" y="120" width="22" height="42" rx="5" fill="#7fd38a"/>
      <line x1="188" y1="70" x2="188" y2="150" stroke="#7fd38a" stroke-width="4"/>
      <rect x="177" y="84" width="22" height="50" rx="5" fill="#7fd38a"/>
    </g>
    <g opacity="0.55">
      <rect x="51" y="162" width="22" height="32" rx="5" fill="#16160e" fill-opacity="0.35"/>
    </g>

    <!-- trend area + line -->
    <path d="M24 196 L62 176 L104 160 L146 140 L188 102 L226 64 L226 248 L24 248 Z" fill="url(#area)"/>
    <path d="M24 196 L62 176 L104 160 L146 140 L188 102 L226 64" fill="none" stroke="url(#line)"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- end point -->
  <circle cx="226" cy="64" r="15" fill="#e3e892" fill-opacity="0.25"/>
  <circle cx="226" cy="64" r="9" fill="#e3e892" stroke="#16160e" stroke-width="3"/>

  <!-- paper corner badge -->
  <g transform="translate(30 30)">
    <path d="M0 6 Q0 0 6 0 H40 L52 12 V46 Q52 52 46 52 H6 Q0 52 0 46 Z" fill="#e5e3d6"/>
    <path d="M40 0 V8 Q40 12 44 12 H52 Z" fill="#c9c7b6"/>
    <g stroke="#47473b" stroke-width="3.5" stroke-linecap="round">
      <line x1="10" y1="22" x2="36" y2="22"/>
      <line x1="10" y1="32" x2="42" y2="32"/>
      <line x1="10" y1="42" x2="30" y2="42"/>
    </g>
  </g>
</svg>
