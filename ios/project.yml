name: PaperTrader
options:
  bundleIdPrefix: com.papertrader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  PaperTrader:
    type: application
    platform: iOS
    sources:
      - path: PaperTrader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papertrader.app
        PRODUCT_NAME: PaperTrader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Manual
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Paper Trader
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Paper Trader connects to the companion server on your PC so Claude can run scans and estimates.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
